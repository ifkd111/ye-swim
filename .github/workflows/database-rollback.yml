name: Database Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Migration version to roll back, for example 0.0.2"
        required: true
        type: string
      confirm:
        description: "Type ROLLBACK to confirm"
        required: true
        type: string

jobs:
  rollback:
    name: Roll back one database migration
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'ROLLBACK' }}
    concurrency:
      group: ye-swim-database-migrate
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_DB_URL"
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Roll back migration
        run: npm run db:rollback
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ROLLBACK_VERSION: ${{ inputs.version }}
